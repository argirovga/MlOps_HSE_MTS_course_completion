version: "3.9"

services:
  kafka:
    image: redpandadata/redpanda:latest
    container_name: kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"    # HTTP API
      - "9000:9000"    # native client
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: hw3_producer
    depends_on:
      - kafka
      - clickhouse      # просто чтобы дождаться старта
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=transactions_raw
      - CSV_PATH=/data/raw_data/test.csv
      - STARTUP_DELAY_SEC=10
    volumes:
      - ./data/raw_data:/data/raw_data:ro

volumes:
  clickhouse-data: